<h1>Financial Transactions Tax</h1>

There are <a href="https://en.wikipedia.org/wiki/Financial_transaction_tax">many ways</a> to tax financial transactions.  In the U.S. there is the <a href="https://en.wikipedia.org/wiki/Let_Wall_Street_Pay_for_the_Restoration_of_Main_Street_Bill">"Let Wall Street Pay for the Restoration of Main Street"</a> which would yield <strong>$150 billion</strong> per year.
